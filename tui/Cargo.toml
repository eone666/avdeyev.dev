[package]
license = "MIT"
name = "avdeyev-tui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "=0.3.1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlButtonElement", "HtmlDialogElement", "KeyboardEvent", "PointerEvent", "FocusEvent", "EventTarget", "DomRect", "CssStyleDeclaration", "MediaQueryList", "Navigator", "Clipboard", "Selection", "HtmlCollection", "Performance", "FontFaceSet", "Node", "Location", "ScrollIntoViewOptions", "ScrollLogicalPosition", "FocusOptions", "WheelEvent", "AddEventListenerOptions"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
