<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#040403">
<link rel="canonical" href="{{ORIGIN}}">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Avdeyev.dev">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{ORIGIN}}">
<meta property="og:image" content="{{SOCIAL_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{SOCIAL_IMAGE}}">
<link rel="alternate" type="application/json" title="JSON Resume" href="/resume.json">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link id="site-favicon" rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/terminal.css">
<script id="structured-data" type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
<p id="boot-status" role="status">Loading terminal…</p>
<main id="tui" aria-label="Ivan Avdeyev — terminal portfolio"></main>
<dialog id="help-dialog" aria-labelledby="help-title" aria-describedby="help-description">
<h2 id="help-title" class="sr-only">Keyboard shortcuts</h2>
<p id="help-description" class="sr-only">Left and right arrows or H and L switch tabs. Up and down arrows or J and K select a link. Enter opens it. C copies the email. Escape closes help.</p>
<div id="help-grid" class="terminal-grid" aria-hidden="true"></div>
<button id="close-help" class="tui-control" type="button" aria-label="Close help"></button>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>This terminal UI requires WebAssembly and JavaScript. Run <code>{{TERMINAL_COMMAND}}</code> in your terminal, or <a href="/cv.pdf">read the CV</a>.</noscript>
<script type="module">
import init from '/wasm/avdeyev_tui.js';
const terminalCommand = {{TERMINAL_COMMAND_JSON}}.replace({{ORIGIN_JSON}}, location.origin);
init().catch(error => { document.getElementById('boot-status').textContent = `Could not load the terminal. Try reloading, or run ${terminalCommand} in your terminal.`; console.error(error); });
</script>
</body>
</html>
